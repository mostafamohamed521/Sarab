{% extends "base/base.html" %}
{% load static %}
{% block title %}Reset Password - Sarab{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="auth-card">
          <div class="text-center mb-4">
            <div style="width:56px;height:56px;border-radius:50%;background:rgba(232,40,26,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;"><i class="fas fa-lock fa-xl" style="color:var(--primary);"></i></div>
            <h3 style="font-family:'Playfair Display',serif;">Forgot <span style="color:var(--primary);">Password?</span></h3>
            <p style="color:#aaa;font-size:.85rem;margin-top:6px;">Enter your email address and we'll send you a link to reset your password.</p>
          </div>
          <form method="POST">{% csrf_token %}
            <div class="mb-4"><label class="flbl">Email Address</label><input type="email" name="email" class="fctrl" placeholder="you@email.com" required autofocus/></div>
            <button type="submit" class="btn-red w-100 justify-content-center d-flex"><i class="fas fa-paper-plane"></i>Send Reset Link</button>
          </form>
          <p class="text-center mt-4" style="font-size:.85rem;color:#aaa;"><a href="{% url 'login' %}" style="color:var(--primary);">← Back to Login</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
