{% extends "base/base.html" %}
{% load static %}
{% block title %}Register - Sarab{% endblock %}
{% block content %}
<div class="auth-wrap" style="padding:50px 0;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card">
          <div class="text-center mb-4">
            <div class="auth-logo"><i class="fas fa-utensils"></i></div>
            <h2 style="font-family:'Playfair Display',serif;font-size:1.7rem;">Create <span style="color:var(--primary);">Account</span></h2>
            <p style="color:#aaa;font-size:.85rem;margin-top:4px;">Join Sarab and start ordering amazing food</p>
          </div>
          <form method="POST" action="{% url 'register' %}">{% csrf_token %}
            <div class="row g-3">
              <div class="col-sm-6"><label class="flbl">First Name *</label><input type="text" name="first_name" class="fctrl" placeholder="John" required/></div>
              <div class="col-sm-6"><label class="flbl">Last Name *</label><input type="text" name="last_name" class="fctrl" placeholder="Doe" required/></div>
              <div class="col-12"><label class="flbl">Email Address *</label><input type="email" name="email" class="fctrl" placeholder="you@email.com" required/></div>
              <div class="col-12"><label class="flbl">Phone <span style="color:#bbb;font-weight:400;">(optional)</span></label><input type="tel" name="phone" class="fctrl" placeholder="+1 (800) 000-0000"/></div>
              <div class="col-sm-6">
                <label class="flbl">Password *</label>
                <div style="position:relative;">
                  <input type="password" name="password1" id="p1" class="fctrl" placeholder="Min. 8 chars" required style="padding-right:44px;"/>
                  <button type="button" onclick="togglePwd('p1','pi1')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#aaa;cursor:pointer;"><i class="fas fa-eye" id="pi1"></i></button>
                </div>
              </div>
              <div class="col-sm-6">
                <label class="flbl">Confirm Password *</label>
                <div style="position:relative;">
                  <input type="password" name="password2" id="p2" class="fctrl" placeholder="Repeat" required style="padding-right:44px;"/>
                  <button type="button" onclick="togglePwd('p2','pi2')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#aaa;cursor:pointer;"><i class="fas fa-eye" id="pi2"></i></button>
                </div>
              </div>
              <div class="col-12">
                <label style="display:flex;align-items:flex-start;gap:8px;font-size:.82rem;color:#666;cursor:pointer;">
                  <input type="checkbox" required style="margin-top:3px;flex-shrink:0;accent-color:var(--primary);"/>
                  <span>I agree to the <a href="{% url 'terms' %}" style="color:var(--primary);">Terms &amp; Conditions</a> and <a href="{% url 'privacy_policy' %}" style="color:var(--primary);">Privacy Policy</a></span>
                </label>
              </div>
              <div class="col-12"><button type="submit" class="btn-red w-100 justify-content-center" style="display:flex;"><i class="fas fa-user-plus"></i>Create Account</button></div>
            </div>
          </form>
          <p class="text-center mt-4" style="font-size:.86rem;color:#aaa;">Already have an account? <a href="{% url 'login' %}" style="color:var(--primary);font-weight:600;">Sign in</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePwd(fId, iId) {
  const f=document.getElementById(fId), i=document.getElementById(iId);
  f.type = f.type==='password' ? 'text' : 'password';
  i.className = f.type==='password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}
</script>
{% endblock %}
