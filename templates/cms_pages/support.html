{% extends "base/base.html" %}
{% block content %}
<div class="container my-5">
  <h2 class="mb-4" style="font-family:'Playfair Display',serif;">Customer Support</h2>
  <div id="chat-window" style="display:flex; flex-direction:column; gap:10px; height:420px; overflow-y:auto; border:1px solid #eee; border-radius:14px; padding:20px; background:#fafafa;"></div>
  <form id="chat-form" class="d-flex gap-2 mt-3">
    {% csrf_token %}
    <input type="text" id="chat-input" class="form-control" placeholder="Type your question..." required style="border-radius:50px;padding:12px 20px;">
    <button type="submit" class="btn-red" style="border:none;border-radius:50px;padding:12px 28px;color:#fff;display:inline-flex;align-items:center;gap:8px;"><i class="fas fa-paper-plane"></i>Send</button>
  </form>
</div>

<style>
.msg { max-width:70%; padding:12px 16px; border-radius:14px; font-size:.92rem; }
.msg.user { align-self:flex-end; background:var(--primary); color:#fff; }
.msg.agent { align-self:flex-start; background:#fff; border:1px solid #eee; color:var(--dark); }
</style>

<script>
const chatWindow = document.getElementById("chat-window");
const form = document.getElementById("chat-form");
const input = document.getElementById("chat-input");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = `msg ${sender}`;
  div.textContent = text;
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMessage(message, "user");
  input.value = "";

  const res = await fetch("{% url 'support_chat_api' %}", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value,
    },
    body: JSON.stringify({ message }),
  });
  const data = await res.json();
  addMessage(data.reply || data.error, "agent");
});
</script>
{% endblock %}
