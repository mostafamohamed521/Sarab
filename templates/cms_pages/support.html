{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <h2 class="mb-4">Customer Support</h2>
  <div id="chat-window" class="chat-window border rounded p-3 mb-3"></div>
  <form id="chat-form" class="d-flex gap-2">
    {% csrf_token %}
    <input type="text" id="chat-input" class="form-control" placeholder="Type your question..." required>
    <button type="submit" class="btn btn-primary">Send</button>
  </form>
</div>

<style>
.chat-window { display:flex; flex-direction:column; gap:8px; height:400px; overflow-y:auto; }
.msg { max-width:70%; padding:10px 14px; border-radius:14px; }
.msg.user { align-self:flex-end; background:#d1e7ff; }
.msg.agent { align-self:flex-start; background:#f0f0f0; }
</style>

<script>
const chatWindow = document.getElementById("chat-window");
const form = document.getElementById("chat-form");
const input = document.getElementById("chat-input");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = `msg ${sender}`;
  div.textContent = text;
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMessage(message, "user");
  input.value = "";

  const res = await fetch("{% url 'support_chat_api' %}", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value,
    },
    body: JSON.stringify({ message }),
  });
  const data = await res.json();
  addMessage(data.reply || data.error, "agent");
});
</script>
{% endblock %}
