databases:
  - name: sarab-db
    plan: free

services:
  - type: web
    name: sarab
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"   # RENDER_EXTERNAL_HOSTNAME is added automatically on top of this in settings.py
      - key: DATABASE_URL
        fromDatabase:
          name: sarab-db
          property: connectionString
      # Set these two yourself in the Render dashboard after deploy —
      # they're real secrets and shouldn't live in a file you commit:
      # STRIPE_PUBLISHABLE_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
